<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>efeu</title>
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="efeu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="icon-192.png" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #23231f;
        --muted: #6c6c66;
        --accent: #2f6fde;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191919;
          --text: #e8e7e3;
          --muted: #9c9b96;
          --accent: #5b8ef0;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main {
        max-width: 340px;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }
      .spinner {
        width: 18px;
        height: 18px;
        margin: 18px auto 0;
        border: 2px solid var(--muted);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        margin-top: 18px;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="apple-touch-icon.png" alt="" />
      <h1 id="title">Verbinde mit deinem Computer …</h1>
      <p id="text">efeu sucht die aktuelle Adresse.</p>
      <div class="spinner" id="spinner"></div>
      <button id="retry" hidden>Erneut versuchen</button>
    </main>
    <script>
      // Startseite für eigene Geräte: findet die aktuelle Adresse des Computers, auf dem efeu läuft.
      // Kanal und Zugangsschlüssel stehen im Fragment (#), das nie an einen Server geht. Bei ntfy.sh
      // liegt unter dem geheimen Kanal nur die Adresse; ohne Schlüssel kommt dort niemand hinein.
      const KEY = 'efeu-device';
      const title = document.getElementById('title');
      const text = document.getElementById('text');
      const spinner = document.getElementById('spinner');
      const retry = document.getElementById('retry');

      function readDevice() {
        const fromLink = new URLSearchParams(location.hash.slice(1)).get('d');
        if (fromLink) {
          try {
            localStorage.setItem(KEY, fromLink);
          } catch {}
          return fromLink;
        }
        try {
          // efeu hieß früher flou: gekoppeltes Gerät vom alten Schlüssel übernehmen.
          const old = localStorage.getItem('flou-device');
          if (old && !localStorage.getItem(KEY)) localStorage.setItem(KEY, old);
          if (old) localStorage.removeItem('flou-device');
          return localStorage.getItem(KEY);
        } catch {
          return null;
        }
      }

      function show(heading, message, busy) {
        title.textContent = heading;
        text.textContent = message;
        spinner.hidden = !busy;
        retry.hidden = busy;
      }

      const device = readDevice();
      const [topic, token] = (device || '').split('.');
      const valid = /^[A-Za-z0-9_-]{24,64}$/.test(topic || '') && /^[0-9a-f]{64}$/.test(token || '');

      async function latestAddress() {
        const response = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=12h`, { cache: 'no-store' });
        if (!response.ok) return null;
        const addresses = (await response.text())
          .split('\n')
          .filter(Boolean)
          .map((line) => JSON.parse(line))
          .filter((event) => event.event === 'message')
          .map((event) => String(event.message).trim())
          .filter((url) => /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url));
        return addresses.at(-1) ?? null;
      }

      async function reachable(url) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 8000);
        try {
          const response = await fetch(`${url}/api/ping`, { cache: 'no-store', signal: controller.signal });
          return response.ok;
        } catch {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      let timer = null;
      async function connect() {
        clearTimeout(timer);
        show('Verbinde mit deinem Computer …', 'efeu sucht die aktuelle Adresse.', true);
        try {
          const url = await latestAddress();
          if (url && (await reachable(url))) {
            location.replace(`${url}/#join=${token}&topic=${topic}`);
            return;
          }
        } catch {}
        show(
          'Computer nicht erreichbar',
          'efeu muss auf deinem Computer geöffnet sein und das Teilen laufen. Es wird automatisch weiter versucht.',
          false,
        );
        timer = setTimeout(connect, 8000);
      }

      retry.addEventListener('click', connect);
      if (valid) connect();
      else show('Link unvollständig', 'Öffne diese Seite über den QR-Code in efeu: Einstellungen → Meine Geräte → iPhone verbinden.', false);
      if (!valid) retry.hidden = true;
    </script>
  </body>
</html>
