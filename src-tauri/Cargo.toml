[package]
name = "flou"
version = "1.9.0"
description = "flou – lokale Notizen und Datenbanken"
edition = "2021"
publish = false

[lib]
name = "flou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["sync", "time", "net", "process", "io-util", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "~2.3.2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
flate2 = "1"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
cpal = "0.18"
tar = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Mitteilungen (Toasts) nur unter Windows, siehe src/notify.rs.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification = "~2.4.0"

# Spracherkennung (Vorlesungen mitschreiben): auf Apple Silicon über Metal, sonst auf der CPU.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
whisper-rs = "0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
