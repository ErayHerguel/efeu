# Baut efeu bei jedem Versions-Tag (z. B. v1.1.0) für macOS und Windows und veröffentlicht ein GitHub-Release:
# efeu.dmg (Mac), efeu-setup.exe (Windows), install.sh (Mac-Installation per Terminal) und die Dateien
# für die eigene Cloud (efeu-server.mjs, efeu-web.tar.gz, jeweils mit Signatur).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal-App: läuft auf Apple Silicon und Intel
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build:mac:universal -- --config src-tauri/tauri.updater.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Dateien sammeln
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="src-tauri/target.noindex/universal-apple-darwin/release/bundle/dmg/efeu_${VERSION}_universal.dmg"
          test -f "$DMG" || { echo "DMG fehlt – stimmt die Version (npm run version:set) mit dem Tag überein?"; exit 1; }
          mkdir -p out
          cp "$DMG" out/efeu.dmg
          cp "$DMG" "out/efeu_${VERSION}_universal.dmg"
          sed "s|__REPO__|${GITHUB_REPOSITORY}|g" website/install.sh > out/install.sh
          # Update-Paket für die App (signiert)
          BUNDLE=src-tauri/target.noindex/universal-apple-darwin/release/bundle/macos
          cp "$BUNDLE/efeu.app.tar.gz" out/efeu_universal.app.tar.gz
          cp "$BUNDLE/efeu.app.tar.gz.sig" out/efeu_universal.app.tar.gz.sig
          # Eigene Cloud: Server-Datei und Web-Oberfläche (signiert) für Docker und eigene Installationen
          for f in efeu-server.mjs efeu-web.tar.gz; do
            test -s "dist-server/$f.sig" || { echo "Signatur für $f fehlt"; exit 1; }
            cp "dist-server/$f" "dist-server/$f.sig" out/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build:win -- --config src-tauri/tauri.updater.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Dateien sammeln
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SETUP="src-tauri/target.noindex/release/bundle/nsis/efeu_${VERSION}_x64-setup.exe"
          test -f "$SETUP" || { echo "Installer fehlt – stimmt die Version mit dem Tag überein?"; ls src-tauri/target.noindex/release/bundle/nsis; exit 1; }
          mkdir -p out
          cp "$SETUP" out/efeu-setup.exe
          cp "$SETUP" "out/efeu_${VERSION}_x64-setup.exe"
          cp "$SETUP.sig" "out/efeu_${VERSION}_x64-setup.exe.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Update-Manifest (latest.json) erzeugen
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          python3 - "$VERSION" "$BASE" <<'PY'
          import json, sys, datetime
          version, base = sys.argv[1], sys.argv[2]
          sig = lambda name: open(f"out/{name}.sig").read().strip()
          manifest = {
              "version": version,
              "notes": f"efeu {version}: Kanban-Spalten konfigurieren und Unteraufgaben auf Karten.",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  # Eine Universal-App für beide Mac-Architekturen
                  "darwin-aarch64": {"signature": sig("efeu_universal.app.tar.gz"), "url": f"{base}/efeu_universal.app.tar.gz"},
                  "darwin-x86_64": {"signature": sig("efeu_universal.app.tar.gz"), "url": f"{base}/efeu_universal.app.tar.gz"},
                  "windows-x86_64": {"signature": sig(f"efeu_{version}_x64-setup.exe"), "url": f"{base}/efeu_{version}_x64-setup.exe"},
              },
          }
          json.dump(manifest, open("out/latest.json", "w"), indent=2)
          PY
          rm out/efeu_universal.app.tar.gz.sig out/efeu_*_x64-setup.exe.sig

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "efeu $VERSION" \
            --notes "**Kanban-Boards konfigurieren:** Spalten hinzufügen, umbenennen (Doppelklick), einfärben, verschieben, ausblenden und löschen. **Unteraufgaben:** To-dos in einem Eintrag zeigen ihren Fortschritt direkt auf der Karte und lassen sich dort abhaken und ergänzen, ohne den Eintrag zu öffnen. Deine Cloud aktualisiert sich beim ersten Verbinden selbst.

          **Mac** (Apple Silicon und Intel, macOS 13+): efeu.dmg laden oder im Terminal \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | bash\`

          **Windows** (10/11, 64 Bit): efeu-setup.exe laden und ausführen. Erscheint „Der Computer wurde durch Windows geschützt“: „Weitere Informationen“ → „Trotzdem ausführen“.

          **Für Profis:** efeu-server.mjs und efeu-web.tar.gz (mit Signaturen) laufen auch per Docker oder auf einem NAS, siehe README."
